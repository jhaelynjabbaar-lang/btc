# BTC Network AI — ingest Worker (Cloudflare Free plan, workers.dev only).
# Secrets are NOT in this file. SUPABASE_SECRET_KEY is a Worker secret (wrangler secret put / API secret_text binding).
name = "btc-network-ingest"
main = "src/index.ts"
compatibility_date = "2026-10-31"
workers_dev = true
preview_urls = false

[observability]
enabled = true

[observability.traces]
enabled = true

[vars]
SUPABASE_URL = "https://kcfeajaycufkskxjyxxb.supabase.co"

# Strict, per-worker replay protection (SQLite-backed Durable Object — available on the Workers Free plan).
[[durable_objects.bindings]]
name = "NONCE_STORE"
class_name = "NonceStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NonceStore"]

# Workers Rate Limiting binding (free, approximate, per Cloudflare location). period must be 10 or 60.
[[ratelimits]]
name = "RL_IP"            # every request, per client IP
namespace_id = "7101"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "RL_ENROLL"        # POST /v1/enroll, per client IP (brute-force guard on one-time codes)
namespace_id = "7102"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "RL_WORKER"        # authenticated requests, per worker id
namespace_id = "7103"
simple = { limit = 40, period = 60 }
