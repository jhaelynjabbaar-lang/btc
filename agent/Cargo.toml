[package]
name = "btc-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Consent-based, fully visible worker agent for BTC Network AI. Wraps an existing open-source miner as a child process."
license = "UNLICENSED"
publish = false

# Standalone crate (the repo root is a Next.js app, there is no Cargo workspace).
[workspace]

[lib]
name = "btc_agent"
path = "src/lib.rs"

[[bin]]
name = "btc-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
bech32 = "0.11"
bs58 = { version = "0.5", features = ["check"] }
clap = { version = "4", features = ["derive", "env"] }
ctrlc = { version = "3", features = ["termination"] }
directories = "5"
ed25519-dalek = "2"
getrandom = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
time = { version = "0.3", features = ["formatting", "macros"] }
toml = "0.8"
ureq = "2"
url = "2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
