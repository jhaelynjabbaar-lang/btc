name: agent-release

# Builds btc-agent for Windows (btc-agent.exe) and Linux, tests both, and attaches them to a GitHub Release.
#
#  * Push a tag `agent-vX.Y.Z`       -> a normal release.
#  * Push a tag `agent-vX.Y.Z-<tag>` -> a PRE-RELEASE (for example agent-v0.1.0-pre.1, built from an unmerged branch).
#  * Run manually (workflow_dispatch) -> builds and uploads workflow artifacts only; no release is created.
on:
  push:
    tags:
      - "agent-v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.85.1"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-22.04, windows-latest]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc

  build-linux:
    name: build (linux x86_64)
    needs: test
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - run: cargo build --release --locked
      - name: Smoke test
        run: |
          ./target/release/btc-agent --version
          ./target/release/btc-agent --home "$RUNNER_TEMP/btc-agent-smoke" status
      - name: Stage
        run: |
          mkdir -p ../dist
          cp target/release/btc-agent ../dist/btc-agent-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: btc-agent-linux-x86_64
          path: dist/btc-agent-linux-x86_64
          if-no-files-found: error

  build-windows:
    name: build (windows x86_64)
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    env:
      # Link the C runtime statically so btc-agent.exe runs on a clean Windows PC without the VC++ redistributable.
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - run: cargo build --release --locked
      - name: Smoke test (the real .exe)
        shell: pwsh
        run: |
          .\target\release\btc-agent.exe --version
          .\target\release\btc-agent.exe --home "$env:RUNNER_TEMP\btc-agent-smoke" status
      - name: Stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ..\dist | Out-Null
          Copy-Item target\release\btc-agent.exe ..\dist\btc-agent.exe
      - uses: actions/upload-artifact@v4
        with:
          name: btc-agent-windows-x86_64
          path: dist/btc-agent.exe
          if-no-files-found: error

  release:
    name: publish GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/agent-v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check the tag matches the crate version
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#agent-v}"
          base="${ver%%-*}"
          crate="$(grep -m1 '^version = ' agent/Cargo.toml | cut -d'"' -f2)"
          echo "tag=$tag version=$ver crate=$crate"
          [ "$base" = "$crate" ] || { echo "tag version $base does not match agent/Cargo.toml version $crate"; exit 1; }
      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          sha256sum btc-agent.exe btc-agent-linux-x86_64 | tee SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          flags=""
          case "$tag" in
            *-*) flags="--prerelease" ;;
          esac
          {
            echo "BTC Network AI worker agent \`${tag#agent-v}\`."
            echo
            if [ -n "$flags" ]; then
              echo "> **PRE-RELEASE.** Built from commit \`${GITHUB_SHA}\` before the pull request was merged. Use it to try the Windows build; do not treat it as a final release."
              echo
            fi
            echo "| File | What it is |"
            echo "| --- | --- |"
            echo "| \`btc-agent.exe\` | Windows 10/11 (64-bit) |"
            echo "| \`btc-agent-linux-x86_64\` | Linux x86_64 (glibc 2.35+) |"
            echo "| \`SHA256SUMS.txt\` | SHA-256 checksums of the files above |"
            echo
            echo "Verify on Windows (PowerShell): \`Get-FileHash .\\btc-agent.exe -Algorithm SHA256\` and compare with \`SHA256SUMS.txt\`."
            echo
            echo "**Windows setup guide:** [agent/WINDOWS.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/agent/WINDOWS.md)"
            echo
            echo "The agent does not contain a miner. Get cpuminer-opt only from its official page: https://github.com/JayDDee/cpuminer-opt/releases"
            echo "A PC CPU earns roughly nothing on Bitcoin and mining raises power use and heat; read the guide first."
            echo
            echo "Built by GitHub Actions from the commit above; tests ran on both Linux and Windows before these files were built."
          } > notes.md
          gh release create "$tag" dist/btc-agent.exe dist/btc-agent-linux-x86_64 dist/SHA256SUMS.txt \
            --title "btc-agent ${tag#agent-v}${flags:+ (pre-release)}" \
            --notes-file notes.md \
            --verify-tag \
            $flags
