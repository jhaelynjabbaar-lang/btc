name: agent-ci

# Lint + test the standalone Rust worker agent (agent/) on Linux and on Windows.
on:
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/agent-ci.yml"
      - ".github/workflows/agent-release.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.85.1"

jobs:
  test:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version
      - name: clippy (warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --locked --all-targets
      - name: cargo test (doc tests)
        run: cargo test --locked --doc
